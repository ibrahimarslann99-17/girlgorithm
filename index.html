<body>

<div id="siren" aria-hidden="true"></div>

<!-- Duotone filter for archetype portraits: grayscale, then a 2-stop channel
     remap from --dt-shadow to --dt-light. The two colours are read from CSS
     at startup (see assets/app.js) so style.css stays the single place to
     tune them; the SVG below is just the machinery. -->
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
  <filter id="duotone" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="
      0.2126 0.7152 0.0722 0 0
      0.2126 0.7152 0.0722 0 0
      0.2126 0.7152 0.0722 0 0
      0      0      0      1 0"/>
    <feComponentTransfer>
      <feFuncR id="dtR" type="table" tableValues="0.078 0.937"/>
      <feFuncG id="dtG" type="table" tableValues="0.067 0.918"/>
      <feFuncB id="dtB" type="table" tableValues="0.055 0.878"/>
    </feComponentTransfer>
  </filter>
</svg>

<div class="shell">
  <div class="masthead">
    <div class="mark">Girlgorithm</div>
    <div class="file" id="fileno">FILE&nbsp;#0000</div>
  </div>
  <div class="rail" id="rail" aria-hidden="true"></div>
  <div id="stage"></div>
</div>

<script src="config.js"></script>
<script src="images.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/math.js"></script>
<script src="assets/db.js"></script>
