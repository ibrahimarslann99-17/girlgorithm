<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#EFEAE0;
    --ink:#14110E;
    --spot:#B4472C;
    --ink-70:rgba(20,17,14,.72);
    --ink-55:rgba(20,17,14,.55);
    --ink-38:rgba(20,17,14,.38);
    --ink-16:rgba(20,17,14,.16);
    --f-display:"Fraunces","Iowan Old Style","Georgia",serif;
    --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1200px;height:630px;background:var(--paper);color:var(--ink);overflow:hidden;}
  .card{width:1200px;height:630px;padding:52px 60px 44px;display:flex;flex-direction:column;position:relative;}

  .head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:12px;}
  .wordmark{font-family:var(--f-display);font-weight:600;font-style:italic;font-size:23px;letter-spacing:.01em;}
  .filestamp{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--ink-55);}

  .rail{display:flex;gap:5px;margin-top:9px;}
  .rail i{display:block;height:2px;flex:1;background:var(--ink-16);}
  .rail i.on{background:var(--spot);}

  .body{flex:1;display:flex;align-items:center;gap:46px;margin-top:26px;}
  .left{flex:1.15;display:flex;flex-direction:column;justify-content:center;}
  .eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--spot);margin-bottom:18px;}
  .headline{font-family:var(--f-display);font-weight:600;font-size:57px;line-height:1.04;letter-spacing:-.01em;}
  .sub{font-family:var(--f-mono);font-size:14px;letter-spacing:.03em;color:var(--ink-70);margin-top:24px;line-height:1.7;}
  .sub b{color:var(--ink);font-weight:600;}

  .right{flex:1;display:flex;align-items:center;justify-content:center;}
  .chart{width:430px;}

  .foot{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--ink);padding-top:16px;margin-top:8px;}
  .url{font-family:var(--f-display);font-weight:600;font-size:22px;}
  .tag{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;color:var(--ink-55);text-transform:uppercase;}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="wordmark">Girlgorithm</div>
      <div class="filestamp">FILE&nbsp;#0001 &mdash; CASE&nbsp;OPEN</div>
    </div>
    <div class="rail">
      <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <div class="body">
      <div class="left">
        <div class="eyebrow">Verdict &mdash; Case Closed</div>
        <div class="headline">The best investment<br>is picking the right<br>partner.</div>
        <div class="sub">So we did the arithmetic.<br>16&nbsp;archetypes &middot; real population data &middot; <b>zero mercy.</b></div>
      </div>
      <div class="right">
        <svg class="chart" viewBox="0 0 520 430" role="img">
          <defs><pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="9" stroke="#B4472C" stroke-opacity=".3" stroke-width="1.4"/></pattern></defs>
          <!-- zones (exact, matching matrixSVG(): W=520,H=430,L=54,R=22,T=26,B=44) -->
          <rect x="54" y="26" width="197.3" height="360" fill="rgba(180,71,44,.08)" stroke="#14110E" stroke-opacity=".16"/>
          <rect x="251.3" y="26" width="246.7" height="108" fill="rgba(180,71,44,.16)" stroke="#14110E" stroke-opacity=".16"/>
          <rect x="251.3" y="134" width="148.0" height="252" fill="rgba(20,17,14,.03)" stroke="#14110E" stroke-opacity=".16"/>
          <rect x="399.3" y="134" width="98.7" height="72" fill="rgba(20,17,14,.06)" stroke="#14110E" stroke-opacity=".16"/>
          <rect x="399.3" y="206" width="98.7" height="120" fill="rgba(20,17,14,.10)" stroke="#14110E" stroke-opacity=".16"/>
          <rect x="399.3" y="326" width="98.7" height="60" fill="rgba(180,71,44,.13)" stroke="#14110E" stroke-opacity=".16"/>
          <rect x="54" y="26" width="197.3" height="360" fill="url(#hatch)" opacity="0.5"/>
          <text x="152.7" y="214" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" letter-spacing="1.4" fill="#14110E" fill-opacity=".55">NO GO ZONE</text>
          <text x="374.7" y="88" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" letter-spacing="1.4" fill="#14110E" fill-opacity=".55">DANGER ZONE</text>
          <text x="325.3" y="268" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" letter-spacing="1.4" fill="#14110E" fill-opacity=".55">FUN ZONE</text>
          <text x="448.7" y="178" text-anchor="middle" font-family="IBM Plex Mono" font-size="10.5" letter-spacing="1.4" fill="#14110E" fill-opacity=".55">DATE ZONE</text>
          <text x="448.7" y="274" text-anchor="middle" font-family="IBM Plex Mono" font-size="10.5" letter-spacing="1.4" fill="#14110E" fill-opacity=".55">WIFE ZONE</text>
          <text x="448.7" y="364" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" letter-spacing="1.4" fill="#14110E" fill-opacity=".55">UNICORN</text>
          <line x1="54" y1="386" x2="498" y2="26" stroke="#14110E" stroke-width="1.75" stroke-opacity=".8"/>
          <line x1="54" y1="386" x2="498" y2="386" stroke="#14110E" stroke-opacity=".3"/>
          <line x1="54" y1="26" x2="54" y2="386" stroke="#14110E" stroke-opacity=".3"/>
          <text x="276" y="424" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="15" letter-spacing="3" fill="#14110E" fill-opacity=".55">HOT</text>
          <text x="14" y="206" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="15" letter-spacing="3" fill="#14110E" fill-opacity=".55" transform="rotate(-90 14 206)">CRAZY</text>
          <line x1="399.3" y1="386" x2="399.3" y2="266" stroke="#B4472C" stroke-width="1" stroke-dasharray="3 3" stroke-opacity=".7"/>
          <line x1="54" y1="266" x2="399.3" y2="266" stroke="#B4472C" stroke-width="1" stroke-dasharray="3 3" stroke-opacity=".7"/>
          <circle cx="399.3" cy="266" r="13" fill="#B4472C" fill-opacity=".18"/>
          <circle cx="399.3" cy="266" r="6" fill="#B4472C" stroke="#EFEAE0" stroke-width="2"/>
          <rect x="340.3" y="233" width="118" height="18" fill="#EFEAE0" stroke="#B4472C" stroke-opacity=".6"/>
          <text x="399.3" y="246" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" letter-spacing="1" fill="#B4472C">YOU WANT (8, 6)</text>
        </svg>
      </div>
    </div>

    <div class="foot">
      <div class="url">girlgorithm.app</div>
      <div class="tag">Seventeen questions &middot; no consequences</div>
    </div>
  </div>
</body>
</html>
